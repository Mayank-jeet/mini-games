<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="../shared/base.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <script src="../theme.js"></script>
    <script src="../shared/game-kit.js"></script>
</head>
<body>
    <header>
        <h1 id="heading_text" class="game_title">Tic Tac Toe</h1>
    </header>
    <main>
        <div class="mode_bar"></div>
        <button id="reset" class="btn"><i class="fa-solid fa-arrow-rotate-left"></i>RESET</button>
        <div class="choices">
            <button class="button" id="0"><p></p></button>
            <button class="button" id="1"><p></p></button>
            <button class="button" id="2"><p></p></button>
            <button class="button" id="3"><p></p></button>
            <button class="button" id="4"><p></p></button>
            <button class="button" id="5"><p></p></button>
            <button class="button" id="6"><p></p></button>
            <button class="button" id="7"><p></p></button>
            <button class="button" id="8"><p></p></button>
        </div>
        <div class="decision status hidden">
            <p id="decision_text">RESULT</p>
        </div>
    </main>
    <script src="tic_tac_toe.js"></script>
</body>
</html>
